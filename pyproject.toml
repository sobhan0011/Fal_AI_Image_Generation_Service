[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "fal-fastapi-image-generation"
version = "1.0.0"
description = "FastAPI image generation API with fal.ai webhooks, transactional AI credits, and idempotent refunds."
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.29,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "fal-client==0.8.0",
  "httpx>=0.27,<1.0",
  "PyNaCl>=1.5,<2.0",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]


[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"


[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]